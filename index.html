<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>burnish — burn after read</title>
<style>
  :root{color-scheme:dark}body{font:16px/1.6 system-ui,max-width:44rem;margin:3rem auto;padding:0 1rem;color:#ddd}
  h1{font-size:1.3rem}textarea{width:100%;min-height:12rem;background:#111;color:#eee;border:1px solid #333;border-radius:8px;padding:.75rem;font:14px/1.5 ui-monospace,monospace}
  button{background:#c33;color:#fff;border:0;border-radius:8px;padding:.6rem 1.2rem;font:inherit;cursor:pointer}
  button:hover{background:#e44}a{color:#fa5;word-break:break-all}.note{color:#888;font-size:.85rem}
  pre{background:#111;padding:.75rem;border-radius:8px;white-space:pre-wrap;word-break:break-word}code{background:#111;padding:.15rem .4rem;border-radius:4px}
</style>
<h1>🔥 burnish</h1>
<div id="app"></div>
<script>
// All crypto is client-side. The AES key travels ONLY in the URL fragment,
// which browsers never send to servers (not in requests, not in Referer).
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = { e: a => btoa(String.fromCharCode(...new Uint8Array(a))),
              d: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };

async function makeKey() {
  const k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  return crypto.subtle.exportKey("raw", k); // 32 random bytes
}
async function encrypt(text, rawKey) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["encrypt"]), enc.encode(text));
  return b64.e(iv) + "." + b64.e(ct); // server stores this opaque blob only
}
async function decrypt(blob, rawKey) {
  const [ivS, ctS] = blob.split(".");
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.d(ivS) }, key, b64.d(ctS)));
}

const app = document.getElementById("app");
const link = (id, rawKey) => `${location.origin}/#${id}.${b64.e(rawKey)}`;

function showCreate() {
  app.innerHTML = `<p class="note">Encrypted in this tab. The server stores only ciphertext and serves it exactly once — second visitor gets “gone”. Copy the link <em>through a private channel</em>; the key lives in the <code>#fragment</code>, which never reaches the host.</p>
  <textarea id="pt" placeholder="secret..." autofocus></textarea><br><br>
  <button id="go">Burn after read</button> <span id="out"></span>`;
  document.getElementById("go").onclick = async () => {
    const text = document.getElementById("pt").value;
    if (!text) return;
    const rawKey = await makeKey();
    const r = await fetch("/paste", { method: "POST", body: await encrypt(text, rawKey) });
    if (!r.ok) { document.getElementById("out").textContent = "✗ " + r.status; return; }
    const u = link(await r.text(), rawKey);
    document.getElementById("pt").value = "";             // clear plaintext from the box
    document.getElementById("out").innerHTML = `✓ <a href="${u}">${u}</a>`;
  };
}

async function showRead(id, rawKey) {
  history.replaceState(null, "", "/");                     // scrub fragment from history immediately
  const r = await fetch(`/paste/${id}`);
  if (r.status === 410) { app.innerHTML = "<p>💨 This paste already burned. If you expected content, someone else read it first.</p>"; return; }
  if (!r.ok) { app.innerHTML = "<p>✗ " + r.status + "</p>"; return; }
  try {
    const text = await decrypt(await r.text(), rawKey);
    app.innerHTML = `<p class="note">Read it now — it no longer exists anywhere.</p><pre id="ct"></pre><p><button onclick="location.reload()">new paste</button></p>`;
    document.getElementById("ct").textContent = text;      // textContent: no HTML ever parsed
  } catch { app.innerHTML = "<p>🔒 Link is corrupt (wrong/truncated key).</p>"; }
}

const h = location.hash.slice(1), m = h.match(/^([0-9a-f]{32})\.(.+)$/);
m ? showRead(m[1], b64.d(m[2])) : showCreate();
</script>
